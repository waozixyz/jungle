name: Desktop and Android release

# Every release includes a tested Linux AppImage and three signed Android APKs.
# Both downloads stay in this job until verified, then publish together.
# No artifact-storage transfer is required between build jobs.
# A version that is already published is never replaced.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      device_test:
        description: Build a signed APK for private device validation without publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jungle-android
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether this version needs a release build
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect the published version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVICE_TEST: ${{ inputs.device_test == true }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          state=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ] && [ "$DEVICE_TEST" != true ]; then
            echo "Jungle Academy $version is already published; its downloads stay unchanged."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  apk:
    name: Linux AppImage and signed Android editions
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j2
      OMP_NUM_THREADS: '1'
      MAGICK_THREAD_LIMIT: '1'
    defaults:
      run:
        working-directory: waozixyz/learning/jungle
    steps:
      - uses: actions/checkout@v7
        with:
          path: waozixyz/learning/jungle
      - name: Read locked dependencies
        id: deps
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock=json.load(open('ziran.lock'))
          print('ziran='+lock['toolchain']['commit'])
          print('kryon='+next(p['commit'] for p in lock['packages'] if p['name']=='kryon'))
          print('version='+open('VERSION').read().strip())
          PY
      - uses: actions/checkout@v7
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.deps.outputs.ziran }}
          path: ziranlang/ziran
      - uses: actions/checkout@v7
        with:
          repository: kryonlabs/kryon
          ref: ${{ steps.deps.outputs.kryon }}
          path: kryonlabs/kryon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcairo2-dev libfreetype-dev libfontconfig-dev libpango1.0-dev libgdk-pixbuf-2.0-0 libvorbisfile3 ffmpeg python3-pil imagemagick xvfb xdotool
      - name: Build compiler and select locked source directories
        run: |
          make -j2 -C "$GITHUB_WORKSPACE/ziranlang/ziran" all
          echo "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          Path('ziran.local.toml').write_text('[overrides]\nziran = "'+str(root/'ziranlang/ziran')+'"\nkryon = "'+str(root/'kryonlabs/kryon')+'"\n')
          PY
          "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran" fetch
      - name: Build and test the Linux AppImage
        run: |
          python3 tools/build_appimage.py
          python3 tests/appimage_test.py
      - name: Install the pinned Android SDK tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'build-tools;36.0.0' 'platforms;android-36' 'cmake;3.22.1'
      - name: Build each edition with both ARM architectures
        run: |
          for edition in direct fdroid gplay; do
            python3 tools/build_android.py --release --abi universal --edition "$edition"
          done
      # Composite actions start at the workspace root. The direct and F-Droid
      # builds read Jungle's Gradle files; gplay applies Kryon's external file.
      - name: Keep Google libraries out of the normal and F-Droid builds
        uses: kryonlabs/kryon/.github/actions/google-free@0532bf87acbf38a182e6d86d910dd6ca9c999d7e
        with:
          source: waozixyz/learning/jungle
          packages: |
            waozixyz/learning/jungle/build/android/JungleAcademy-universal-release-unsigned.apk
            waozixyz/learning/jungle/build/android/JungleAcademy-universal-fdroid-release-unsigned.apk
      - name: Require the Google Play edition to carry Play Billing
        uses: kryonlabs/kryon/.github/actions/google-free@0532bf87acbf38a182e6d86d910dd6ca9c999d7e
        with:
          source: ''
          expect-google: 'true'
          packages: waozixyz/learning/jungle/build/android/JungleAcademy-universal-gplay-release-unsigned.apk
      - name: Sign and verify every Android edition
        env:
          KEYSTORE: ${{ secrets.JUNGLE_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.JUNGLE_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          trap 'rm -f "$RUNNER_TEMP/jungle-release.p12" "$RUNNER_TEMP/jungle-password"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/jungle-release.p12"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/jungle-password"
          for edition in direct fdroid gplay; do
            case "$edition" in
              direct) suffix='' ;;
              *) suffix="-$edition" ;;
            esac
            python3 tools/android_release.py sign \
              "build/android/JungleAcademy-universal${suffix}-release-unsigned.apk" \
              --edition "$edition" \
              --keystore "$RUNNER_TEMP/jungle-release.p12" --password-file "$RUNNER_TEMP/jungle-password"
          done
      - name: Save the signed APK for private device validation
        if: github.event_name == 'workflow_dispatch' && inputs.device_test == true
        uses: actions/upload-artifact@v4
        with:
          name: jungle-device-validation
          retention-days: 1
          if-no-files-found: error
          path: waozixyz/learning/jungle/build/downloads/jungle-v${{ steps.deps.outputs.version }}.apk
      - name: Release notes
        env:
          VERSION: ${{ steps.deps.outputs.version }}
        run: |
          python3 - <<'PY' > build/release-notes.md
          import os, re
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(os.environ['VERSION']) + r'\s*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          assert section, 'CHANGELOG.md needs a section for ' + os.environ['VERSION']
          print(section[1].strip())
          PY
      - name: Save private test captures on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-failure
          retention-days: 1
          path: |
            waozixyz/learning/jungle/build/tests/ui/*.png
            waozixyz/learning/jungle/build/tests/ui/*.log
          if-no-files-found: ignore
      - name: Publish this version once its download is verified
        if: github.ref == 'refs/heads/master' && inputs.device_test != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.deps.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Jungle Academy $VERSION is already published; its signed APK was built and verified again."
            exit 0
          fi
          if [ "$state" = missing ]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Jungle Academy $VERSION" --notes-file build/release-notes.md
          fi
          gh release upload "$tag" \
            "build/downloads/jungle-v$VERSION.apk" \
            "build/downloads/jungle-v$VERSION-fdroid.apk" \
            "build/downloads/jungle-v$VERSION-gplay.apk" \
            "build/downloads/jungle-v$VERSION-x86_64.AppImage" \
            "build/downloads/jungle-v$VERSION-x86_64.AppImage.sha256" --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Install itch.io Butler
        if: github.ref == 'refs/heads/master' && inputs.device_test != true
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the verified normal Android and Linux downloads to itch.io
        if: github.ref == 'refs/heads/master' && inputs.device_test != true
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          VERSION: ${{ steps.deps.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'; exit 1; }
          test -f "build/downloads/jungle-v$VERSION.apk"
          test -f "build/downloads/jungle-v$VERSION-fdroid.apk"
          test -f "build/downloads/jungle-v$VERSION-gplay.apk"
          test -f "build/downloads/jungle-v$VERSION-x86_64.AppImage"
          butler push "build/downloads/jungle-v$VERSION.apk" waozi/jungle:android --userversion "$VERSION"
          butler push "build/downloads/jungle-v$VERSION-x86_64.AppImage" waozi/jungle:linux --userversion "$VERSION"
          butler status waozi/jungle

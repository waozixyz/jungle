name: Build and deploy Jungle

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jungle-${{ github.ref }}
  cancel-in-progress: false

env:
  MAKEFLAGS: -j2
  CHROMIUM: google-chrome
  YUE_DESKTOP_RECOVERY: '0'
  SDL_AUDIODRIVER: dummy

defaults:
  run:
    working-directory: waozixyz/learning/jungle

# One build, four validation machines, one package, then publication. Every
# later job restores the build job's exact outputs. The groups and lanes are
# checked against tools/run_ci_validation.py by tests/ci_validation_test.py.
jobs:
  build:
    name: Build Jungle
    runs-on: ubuntu-latest
    steps:
      - &checkout-jungle
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: waozixyz/learning/jungle
      - &read-locks
        name: Read locked dependencies
        id: deps
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock=json.load(open('ziran.lock'))
          print('ziran='+lock['toolchain']['commit'])
          print('kryon='+next(p['commit'] for p in lock['packages'] if p['name']=='kryon'))
          PY
      - &checkout-ziran
        uses: actions/checkout@v7
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.deps.outputs.ziran }}
          path: ziranlang/ziran
      - &checkout-kryon
        uses: actions/checkout@v7
        with:
          repository: kryonlabs/kryon
          ref: ${{ steps.deps.outputs.kryon }}
          path: kryonlabs/kryon
      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.6'
      - &install-tools
        name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcairo2-dev libfreetype-dev libfontconfig-dev libpango1.0-dev libvorbisfile3 ffmpeg python3-pil python3-numpy xvfb xdotool imagemagick ghostscript tesseract-ocr tesseract-ocr-deu tesseract-ocr-spa
      - name: Check the validation schedule and shared build contract
        run: |
          python3 tests/ci_validation_test.py
          python3 tests/ci_artifacts_test.py
      - name: Build compiler
        run: make -j2 -C "$GITHUB_WORKSPACE/ziranlang/ziran" all
      - &select-sources
        name: Select the compiler and locked source directories
        run: |
          echo "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin" >> "$GITHUB_PATH"
          echo "ZIRAN_ROOT=$GITHUB_WORKSPACE/ziranlang/ziran" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          Path('ziran.local.toml').write_text('[overrides]\nziran = "'+str(root/'ziranlang/ziran')+'"\nkryon = "'+str(root/'kryonlabs/kryon')+'"\n')
          PY
      - name: Build and run local tests
        run: |
          mkdir -p work/b work/w
          export TMPDIR="$PWD/work/b"
          unset DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS SESSION_MANAGER
          make -j2 all
          make test
          python3 tools/build_web.py
      - name: Preserve the browser build for diagnosis
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
          retention-days: 1
          overwrite: true
          path: waozixyz/learning/jungle/build/web/
      - name: Pack the shared build
        run: python3 tools/ci_artifacts.py pack --kind build --revision "$GITHUB_SHA" --output work/ci-build.tar.gz --toolchain "$ZIRAN_ROOT"
      - name: Upload the shared build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          path: waozixyz/learning/jungle/work/ci-build.tar.gz
      - &save-captures
        name: Save private test captures on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: website-ui-failure-${{ github.job }}-${{ strategy.job-index }}
          retention-days: 1
          overwrite: true
          path: |
            waozixyz/learning/jungle/build/tests/ui/*.png
            waozixyz/learning/jungle/build/tests/ui/*.log
            waozixyz/learning/jungle/build/tests/web/*.png
            waozixyz/learning/jungle/backup/**/*.png
            waozixyz/learning/jungle/backup/**/*.log
            waozixyz/learning/jungle/work/hide-seek-levels/ui/*
            waozixyz/learning/jungle/work/ci-validation/*.log
            waozixyz/learning/jungle/work/ci-validation/*/ui/*.png
            waozixyz/learning/jungle/work/ci-validation/*/ui/*.log
          if-no-files-found: ignore

  validate:
    name: Validate lane ${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Every lane reports its own result; publication still needs all of them.
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: a
            groups: '["browser"]'
          - lane: b
            groups: '["performance", "paint"]'
          - lane: c
            groups: '["hide-seek", "activities", "book-en"]'
          - lane: d
            groups: '["book-de", "book-es", "books", "navigation"]'
    steps:
      - *checkout-jungle
      - *read-locks
      - *checkout-ziran
      - *checkout-kryon
      - *setup-node
      - *install-tools
      - *select-sources
      - &download-build
        name: Download the shared build
        uses: actions/download-artifact@v4
        with:
          name: ci-build-${{ github.sha }}
          path: waozixyz/learning/jungle/work/ci-artifacts
      - &restore-build
        name: Restore the shared build
        run: python3 tools/ci_artifacts.py restore --kind build --revision "$GITHUB_SHA" --archive work/ci-artifacts/ci-build.tar.gz --toolchain "$ZIRAN_ROOT"
      - name: Validate hide-seek
        if: contains(fromJSON(matrix.groups), 'hide-seek')
        run: python3 tools/run_ci_validation.py --group hide-seek
      - name: Validate browser
        if: contains(fromJSON(matrix.groups), 'browser')
        run: python3 tools/run_ci_validation.py --group browser
      - name: Validate performance
        if: contains(fromJSON(matrix.groups), 'performance')
        run: python3 tools/run_ci_validation.py --group performance
      - name: Validate paint
        if: contains(fromJSON(matrix.groups), 'paint')
        run: python3 tools/run_ci_validation.py --group paint
      - name: Validate activities
        if: contains(fromJSON(matrix.groups), 'activities')
        run: python3 tools/run_ci_validation.py --group activities
      - name: Validate book-en
        if: contains(fromJSON(matrix.groups), 'book-en')
        run: python3 tools/run_ci_validation.py --group book-en
      - name: Validate book-de
        if: contains(fromJSON(matrix.groups), 'book-de')
        run: python3 tools/run_ci_validation.py --group book-de
      - name: Validate book-es
        if: contains(fromJSON(matrix.groups), 'book-es')
        run: python3 tools/run_ci_validation.py --group book-es
      - name: Validate books
        if: contains(fromJSON(matrix.groups), 'books')
        run: python3 tools/run_ci_validation.py --group books
      - name: Validate navigation
        if: contains(fromJSON(matrix.groups), 'navigation')
        run: python3 tools/run_ci_validation.py --group navigation
      - name: Upload the benchmark of the shared build
        if: contains(fromJSON(matrix.groups), 'performance')
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-${{ github.sha }}
          retention-days: 1
          overwrite: true
          if-no-files-found: error
          path: |
            waozixyz/learning/jungle/build/web/performance.json
            waozixyz/learning/jungle/build/web/performance.html
            waozixyz/learning/jungle/build/web/performance-report.md
      - *save-captures

  package:
    name: Package and test the embed edition
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - *checkout-jungle
      - *read-locks
      - *checkout-ziran
      - *checkout-kryon
      - *setup-node
      - *install-tools
      - *select-sources
      - *download-build
      - *restore-build
      - name: Download the benchmark of the shared build
        uses: actions/download-artifact@v4
        with:
          name: ci-performance-${{ github.sha }}
          path: waozixyz/learning/jungle/work/ci-artifacts/performance
      - name: Add the benchmark to the tested website
        run: python3 tools/run_ci_validation.py --apply-performance work/ci-artifacts/performance --revision "$GITHUB_SHA"
      - name: Prepare and test the embed edition
        run: python3 tools/run_ci_validation.py --group packaging
      - name: Pack the tested website
        run: python3 tools/ci_artifacts.py pack --kind web --revision "$GITHUB_SHA" --output work/ci-web.tar.gz
      - name: Upload the tested website
        uses: actions/upload-artifact@v4
        with:
          name: ci-web-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          path: waozixyz/learning/jungle/work/ci-web.tar.gz
      - *save-captures

  publish:
    name: Publish the tested website
    needs: package
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - *checkout-jungle
      - *setup-node
      - name: Download the tested website
        uses: actions/download-artifact@v4
        with:
          name: ci-web-${{ github.sha }}
          path: waozixyz/learning/jungle/work/ci-artifacts
      - name: Restore the tested website
        run: python3 tools/ci_artifacts.py restore --kind web --revision "$GITHUB_SHA" --archive work/ci-artifacts/ci-web.tar.gz
      - name: Publish the tested website
        env:
          CLOUDFLARE_ACCOUNT_ID: '244fef03abd1e471baed2ec35c59e9e7'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add the scoped CLOUDFLARE_API_TOKEN repository secret to enable deployment.'; exit 1; }
          npx --yes wrangler@4.152.0 pages deploy build/web --project-name jungle --branch master --commit-hash "$GITHUB_SHA"
          python3 tools/connect_domain.py
      - name: Verify public version
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          for attempt in range(20):
              try:
                  request=urllib.request.Request('https://jungle.waozi.xyz/version.json?run='+os.environ['GITHUB_RUN_ID'],headers={'User-Agent':'Jungle-deployment-verification'})
                  with urllib.request.urlopen(request,timeout=15) as response:data=json.load(response)
                  if data['revision']==os.environ['GITHUB_SHA']:break
              except Exception:pass
              time.sleep(3)
          else:raise SystemExit('The exact deployed revision is not yet verified on jungle.waozi.xyz')
          print('Verified deployed Jungle version '+data['version'])
          for path,checks in {
              '':['data-backend="canvas"','jungle.js?v='+os.environ['GITHUB_SHA']],
              'dom.html':['data-backend="dom"','jungle-dom.js?v='+os.environ['GITHUB_SHA']],
              'canvas.html':['data-backend="canvas"','jungle.js?v='+os.environ['GITHUB_SHA']],
              'performance.html':['Jungle browser benchmarks','Jungle · Canvas and native DOM','Download complete JSON'],
          }.items():
              # Pages can reach an edge at different times after version.json.
              # Require every page's exact revision, allowing propagation first.
              for attempt in range(20):
                  try:
                      request=urllib.request.Request('https://jungle.waozi.xyz/'+path+'?run='+os.environ['GITHUB_RUN_ID'],headers={'User-Agent':'Jungle-deployment-verification','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:text=response.read().decode()
                      missing=[check for check in checks if check not in text]
                      if not missing:break
                      problem='missing '+repr(missing)
                  except Exception as error:problem=str(error)
                  time.sleep(3)
              else:raise SystemExit('Deployed '+path+' could not be verified: '+problem)
              print('Verified deployed '+path)
          PY
      - name: Install itch.io Butler
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the tested browser edition to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'; exit 1; }
          test -f build/itch-web/index.html
          butler push build/itch-web waozi/jungle:html5 --userversion "$(cat VERSION)"
          butler status waozi/jungle

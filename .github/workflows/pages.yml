name: Build and deploy Jungle

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jungle-${{ github.ref }}
  cancel-in-progress: false

env:
  MAKEFLAGS: -j2
  YUE_DESKTOP_RECOVERY: '0'
  SDL_AUDIODRIVER: dummy

defaults:
  run:
    working-directory: waozixyz/learning/jungle

# One build with fast non-browser local checks, one package, then publication.
# Every later job restores the build job's exact outputs.
jobs:
  build:
    name: Build Jungle
    runs-on: ubuntu-latest
    steps:
      - &checkout-jungle
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: waozixyz/learning/jungle
      - &read-locks
        name: Read locked dependencies
        id: deps
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock=json.load(open('ziran.lock'))
          print('ziran='+lock['toolchain']['commit'])
          print('kryon='+next(p['commit'] for p in lock['packages'] if p['name']=='kryon'))
          PY
      - &checkout-ziran
        uses: actions/checkout@v7
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.deps.outputs.ziran }}
          path: ziranlang/ziran
      - &checkout-kryon
        uses: actions/checkout@v7
        with:
          repository: kryonlabs/kryon
          ref: ${{ steps.deps.outputs.kryon }}
          path: kryonlabs/kryon
      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.6'
      - &install-tools
        name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcairo2-dev libfreetype-dev libfontconfig-dev libpango1.0-dev libvorbisfile3 ffmpeg python3-pil python3-numpy python3-scipy python3-cairosvg libpotrace0 imagemagick ghostscript
      - name: Check the shared build contract
        run: |
          python3 tests/ci_artifacts_test.py
      - name: Build compiler
        run: make -j2 -C "$GITHUB_WORKSPACE/ziranlang/ziran" all
      - &select-sources
        name: Select the compiler and locked source directories
        run: |
          echo "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin" >> "$GITHUB_PATH"
          echo "ZIRAN_ROOT=$GITHUB_WORKSPACE/ziranlang/ziran" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          Path('ziran.local.toml').write_text('[overrides]\nziran = "'+str(root/'ziranlang/ziran')+'"\nkryon = "'+str(root/'kryonlabs/kryon')+'"\n')
          PY
      - name: Build and run fast non-browser tests
        run: |
          mkdir -p work/b work/w
          export TMPDIR="$PWD/work/b"
          unset DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS SESSION_MANAGER
          make -j2 all
          make -j2 build/tests/printing build/tests/paint_preview
          python3 tools/title_scenes.py --check
          python3 tests/title_guide_test.py
          python3 tests/title_scenes_test.py
          python3 tests/title_room_test.py
          python3 tests/title_desert_test.py
          python3 tests/webp_standard_test.py
          python3 tests/canonical_webp_test.py
          python3 tests/image_exports_test.py
          python3 tests/runtime_images_test.py
          python3 tests/sweet_porridge_test.py
          python3 tests/town_musicians_test.py
          python3 tests/garden_assets_test.py
          python3 tests/piano_audio_test.py
          python3 tests/paint_preview_test.py
          python3 tests/paint_catalog_test.py
          python3 tests/paint_vectors_test.py
          python3 tests/paint_stencil_regions_test.py
          python3 tests/export_test.py
          python3 tests/assets_test.py
          python3 tests/shared_assets_test.py
          python3 tests/port_games_integration_test.py
          python3 tests/speech_manifest_test.py
          python3 tests/english_speech_test.py
          python3 tests/shapes_tutorial_audio_test.py
          python3 tests/speech_codec_test.py
          python3 tests/book_unique_catalog_test.py
          python3 tests/book_unique_art_test.py
          python3 tests/book_minimum_art_test.py
          python3 tests/book_expansion_test.py
          python3 tests/language_test.py
          python3 tests/abc_audio_test.py
          python3 tests/numbers_audio_test.py
          python3 tests/jigsaw_art_test.py
          python3 tests/activity_covers_test.py
          python3 tests/brand_metadata_test.py
          python3 tests/asset_packs_test.py
          python3 tests/android_editions_test.py
          python3 tools/build_web.py
      - name: Preserve the browser build for diagnosis
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
          retention-days: 1
          overwrite: true
          path: waozixyz/learning/jungle/build/web/
      - name: Pack the shared build
        run: python3 tools/ci_artifacts.py pack --kind build --revision "$GITHUB_SHA" --output work/ci-build.tar.gz --toolchain "$ZIRAN_ROOT"
      - name: Upload the shared build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          path: waozixyz/learning/jungle/work/ci-build.tar.gz
  package:
    name: Package the embed edition
    needs: build
    runs-on: ubuntu-latest
    steps:
      - *checkout-jungle
      - *read-locks
      - *checkout-ziran
      - *checkout-kryon
      - *setup-node
      - *install-tools
      - *select-sources
      - &download-build
        name: Download the shared build
        uses: actions/download-artifact@v4
        with:
          name: ci-build-${{ github.sha }}
          path: waozixyz/learning/jungle/work/ci-artifacts
      - &restore-build
        name: Restore the shared build
        run: python3 tools/ci_artifacts.py restore --kind build --revision "$GITHUB_SHA" --archive work/ci-artifacts/ci-build.tar.gz --toolchain "$ZIRAN_ROOT"
      - name: Prepare the embed edition
        run: python3 tools/prepare_itch.py
      - name: Pack the tested website
        run: python3 tools/ci_artifacts.py pack --kind web --revision "$GITHUB_SHA" --output work/ci-web.tar.gz
      - name: Upload the tested website
        uses: actions/upload-artifact@v4
        with:
          name: ci-web-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          path: waozixyz/learning/jungle/work/ci-web.tar.gz

  publish:
    name: Publish the tested website
    needs: package
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - *checkout-jungle
      - *setup-node
      - name: Download the tested website
        uses: actions/download-artifact@v4
        with:
          name: ci-web-${{ github.sha }}
          path: waozixyz/learning/jungle/work/ci-artifacts
      - name: Restore the tested website
        run: python3 tools/ci_artifacts.py restore --kind web --revision "$GITHUB_SHA" --archive work/ci-artifacts/ci-web.tar.gz
      - name: Publish the tested website
        env:
          CLOUDFLARE_ACCOUNT_ID: '244fef03abd1e471baed2ec35c59e9e7'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add the scoped CLOUDFLARE_API_TOKEN repository secret to enable deployment.'; exit 1; }
          npx --yes wrangler@4.152.0 pages deploy build/web --project-name jungle --branch master --commit-hash "$GITHUB_SHA"
          python3 tools/connect_domain.py
      - name: Verify public version
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          for attempt in range(20):
              try:
                  request=urllib.request.Request('https://jungle.waozi.xyz/version.json?run='+os.environ['GITHUB_RUN_ID'],headers={'User-Agent':'Jungle-deployment-verification'})
                  with urllib.request.urlopen(request,timeout=15) as response:data=json.load(response)
                  if data['revision']==os.environ['GITHUB_SHA']:break
              except Exception:pass
              time.sleep(3)
          else:raise SystemExit('The exact deployed revision is not yet verified on jungle.waozi.xyz')
          print('Verified deployed Jungle version '+data['version'])
          for path,checks in {
              '':['data-backend="canvas"','jungle.js?v='+os.environ['GITHUB_SHA']],
              'dom.html':['data-backend="dom"','jungle-dom.js?v='+os.environ['GITHUB_SHA']],
              'canvas.html':['data-backend="canvas"','jungle.js?v='+os.environ['GITHUB_SHA']],
          }.items():
              # Pages can reach an edge at different times after version.json.
              # Require every page's exact revision, allowing propagation first.
              for attempt in range(20):
                  try:
                      request=urllib.request.Request('https://jungle.waozi.xyz/'+path+'?run='+os.environ['GITHUB_RUN_ID'],headers={'User-Agent':'Jungle-deployment-verification','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:text=response.read().decode()
                      missing=[check for check in checks if check not in text]
                      if not missing:break
                      problem='missing '+repr(missing)
                  except Exception as error:problem=str(error)
                  time.sleep(3)
              else:raise SystemExit('Deployed '+path+' could not be verified: '+problem)
              print('Verified deployed '+path)
          PY
      - name: Install itch.io Butler
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the tested browser edition to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'; exit 1; }
          test -f build/itch-web/index.html
          butler push build/itch-web waozi/jungle:html5 --userversion "$(cat VERSION)"
          butler status waozi/jungle

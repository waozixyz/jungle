<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#e3ece4">
<meta name="description" content="Gentle watercolor learning games. Picture books, animal counting and dinosaur coloring in English, German and Spanish.">
<title>Jungle Academy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e3ece4;font-family:system-ui,sans-serif;color:#3e332a}body{display:flex;align-items:center;justify-content:center}#canvas-frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}body{height:var(--app-height,100dvh)}#canvas-frame{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#mobile-input{position:fixed;bottom:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:.01;font-size:16px}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:#e3ece4;pointer-events:none}#loading strong{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:500}#loading p{font-size:1rem}#print-sheet{display:none}@media print{body{display:block;background:white}#canvas-frame,body{height:var(--app-height,100dvh)}#canvas-frame{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#mobile-input{position:fixed;bottom:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:.01;font-size:16px}#loading{display:none!important}#print-sheet{display:block;padding:1cm;color:black}#print-picture{width:100%;image-rendering:auto}#print-story{white-space:pre-wrap;font:16px/1.5 system-ui,sans-serif}}
</style>
<div id="canvas-frame"><canvas id="canvas" tabindex="0" aria-label="Jungle Academy learning games"></canvas></div>
<div id="loading" role="status"><strong>Jungle Academy</strong><p id="status">Opening your books…</p></div>
<textarea id="mobile-input" disabled aria-label="Story text" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
<section id="print-sheet"><img id="print-picture" alt="Your dinosaur picture"><pre id="print-story"></pre></section>
<script>
const imageLoads=new Map();
let imagePaths=new Set();
async function loadImage(path){
 if(Module.FS.analyzePath('/'+path).exists)return;
 if(imageLoads.has(path))return imageLoads.get(path);
 const request=fetch(path).then(async response=>{
  if(!response.ok)throw Error(path);
  const bytes=new Uint8Array(await response.arrayBuffer());
  Module.FS.mkdirTree('/'+path.substring(0,path.lastIndexOf('/')));
  Module.FS.writeFile('/'+path,bytes);
 });
 imageLoads.set(path,request);return request;
}
var Module={canvas:document.getElementById('canvas'),locateFile:p=>p,print:console.log,printErr:console.error,
 jungleImageReady(path){
  if(Module.FS.analyzePath('/'+path).exists)return true;
  if(imagePaths.has(path)&&!imageLoads.has(path))void loadImage(path).catch(console.error);
  return false;
 },
 preRun:[function(){
  Module.addRunDependency('menu-pictures');
  fetch('images.json').then(r=>{if(!r.ok)throw Error('picture list');return r.json()}).then(async paths=>{
   imagePaths=new Set(paths);
   await Promise.all(paths.filter(p=>p.endsWith('/font.png')||p.startsWith('assets/jungle/covers/')).map(loadImage));
   Module.removeRunDependency('menu-pictures');
   // Warm just the shelf covers while the menu is already interactive.
   for(const path of paths.filter(p=>p.startsWith('assets/jungle-book/previews/')))void loadImage(path).catch(console.error);
  }).catch(e=>{console.error(e);Module.onAbort()});
 }],
 onRuntimeInitialized(){document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';document.getElementById('canvas').focus()},
 onAbort(){document.getElementById('loading').style.display='grid';document.getElementById('status').textContent='The game could not open. Please reload to try again.'}
};

const mobileInput=document.getElementById('mobile-input');
const keyToCanvas=(key,code=key)=>{for(const type of ['keydown','keyup'])Module.canvas.dispatchEvent(new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true}))};
const flushMobileText=()=>{if(mobileInput.composing)return;for(const key of mobileInput.value){if(key===' ')keyToCanvas(' ','Space');else Module.canvas.dispatchEvent(new KeyboardEvent('keypress',{key,bubbles:true,cancelable:true}))};mobileInput.value=''};
mobileInput.addEventListener('input',flushMobileText);
mobileInput.addEventListener('compositionstart',()=>mobileInput.composing=true);
mobileInput.addEventListener('compositionend',()=>{mobileInput.composing=false;flushMobileText()});
mobileInput.addEventListener('beforeinput',event=>{if(event.inputType==='deleteContentBackward'){event.preventDefault();keyToCanvas('Backspace')}if(event.inputType==='insertLineBreak'){event.preventDefault();keyToCanvas('Enter')}});
Module.canvas.addEventListener('pointerup',()=>{if(Module.jungleKeyboardWanted&&matchMedia('(pointer:coarse)').matches)mobileInput.focus({preventScroll:true})});
const resizeApp=()=>document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||innerHeight)+'px');
window.visualViewport?.addEventListener('resize',resizeApp);addEventListener('resize',resizeApp);resizeApp();
</script>
<script src="jungle.js" defer></script>
</html>

// Animation frames stop in hidden tabs. Keep the learning sequence ticking
// with a timer while hidden, and resume normal browser frames when visible.
const browserFrame=window.requestAnimationFrame.bind(window);
const cancelBrowserFrame=window.cancelAnimationFrame.bind(window);
const pendingFrames=new Map();let nextFrameId=1;

  if(!pendingFrames.has(id))return;
  pendingFrames.delete(id);cancelBrowserFrame(entry.frame);clearTimeout(entry.timer);callback(time);
 }};
 pendingFrames.set(id,entry);entry.frame=browserFrame(entry.run);scheduleHiddenFrames();return id;
};

const imageLoads=new Map();
let imagePaths=new Set();
let assetPacks,assetPackIndex;
// The menu pictures and bitmap fonts are separate files (tools/build_web.py),
// so the menu never waits for the full pack index; everything else does.
const directAsset=path=>path.startsWith('assets/jungle/')&&!path.endsWith('.wav')||path.endsWith('/font.png');
function packIndex(){
 assetPackIndex??=fetchResource('asset-packs.json',response=>response.json())
  .then(manifest=>assetPacks=new JungleAssetPacks(manifest,(path,priority)=>fetchResource(path,response=>response.arrayBuffer(),priority),16*1024*1024,forgetResource))
  .catch(error=>{assetPackIndex=undefined;throw error});

}
async function assetBytes(path,priority){
 if(typeof Module!=='undefined'&&Module.FS?.analyzePath('/'+path).exists)return Module.FS.readFile('/'+path);
 if(!directAsset(path)){
  const packs=await packIndex();
  if(Object.hasOwn(packs.manifest.files,path))return packs.read(path,priority);
 }

}
// Narration ships as Ogg Vorbis speech clips; assets/speech.txt
// (tools/shared_assets.py SpeechIndexText) composes each narration path from
// clip ranges and silences. Clips are checked like the native hosts'
// SpeechPreflight before they are decoded, and the composed samples play as
// one WAV through the same Audio element as every other sound.
const speechRate=22050,speechLimit=speechRate*60,speechBytes=524288;
let speechIndex,speechResolved;
function parseSpeech(text){
 const lines=text.split('\n'),clips=[],voices=new Map(),number=/^(?:0|[1-9][0-9]{0,8})$/;

 if(lines[0]!=='#jungle-speech-1'||lines.pop()!=='')invalid();
 const safe=(path,suffix)=>path.startsWith('assets/')&&path.endsWith(suffix)&&!/[\x00-\x20\x7f\\|]/.test(path)&&path.split('/').every(part=>part&&part!=='.'&&part!=='..');
 let previous='';
 for(const line of lines.slice(1)){
  const fields=line.split('|');
  if(fields.length!==3)invalid();
  const [kind,path,value]=fields;
  if(kind==='clip'&&!voices.size&&safe(path,'.ogg')&&path.startsWith('assets/speech/')&&path>previous&&number.test(value)&&+value>0&&+value<=speechLimit){clips.push({path,frames:+value})}
  else if(kind==='voice'&&safe(path,'.wav')&&(!voices.size||path>previous)){
   let total=0;
   const segments=value.split(' ').map(token=>{
    const parts=token.split(':');
    if(!(parts.length===1||parts.length===3)||!parts.every(part=>number.test(part)))invalid();
    const [clip,start,frames]=parts.length===1?[-1,0,+parts[0]]:parts.map(Number);
    if(frames<1||(clip>=0&&(clip>=clips.length||start+frames>clips[clip].frames)))invalid();
    total+=frames;return {clip,start,frames};
   });
   if(total>speechLimit)invalid();
   voices.set(path,segments);
  }else invalid();

}
function speech(){
 speechIndex??=assetBytes('assets/speech.txt').then(bytes=>speechResolved=parseSpeech(new TextDecoder('utf-8',{fatal:true}).decode(bytes)))
  .catch(error=>{speechIndex=undefined;throw error});

}
// Whether BYTES is one whole Ogg Vorbis stream of exactly FRAMES mono frames
// at speechRate, read from its pages before any decoder allocates for it.
function speechPreflight(bytes,frames){
 if(bytes.length<1||bytes.length>speechBytes||frames<1||frames>speechLimit)return false;
 const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 let at=0,serial,granule,first;
 while(at<bytes.length){
  if(bytes.length-at<27||view.getUint32(at)!==0x4f676753||bytes[at+4]!==0)return false;
  const flags=bytes[at+5],segments=bytes[at+26],body=at+27+segments;
  if(serial===undefined)serial=view.getUint32(at+14,true);else if(view.getUint32(at+14,true)!==serial)return false;

  let size=0;for(let index=0;index<segments;index++)size+=bytes[at+27+index];
  first??=bytes.subarray(body,body+(segments?bytes[at+27]:0));
  granule=view.getBigInt64(at+6,true);at=body+size;
  if(at>bytes.length||Boolean(flags&4)!==(at===bytes.length))return false;

  new DataView(first.buffer,first.byteOffset+12,4).getUint32(0,true)===speechRate&&granule===BigInt(frames);
}
const decodedSpeech=new Map();
async function speechClip(clip){
 if(decodedSpeech.has(clip.path))return decodedSpeech.get(clip.path);

 decodedSpeech.set(clip.path,pending);return pending;
}
async function decodeSpeechClip(clip){
 const bytes=await assetBytes(clip.path);
 if(!speechPreflight(bytes,clip.frames))throw Error('Malformed speech clip: '+clip.path);

 if(audio.sampleRate!==speechRate||audio.numberOfChannels!==1||audio.length!==clip.frames)throw Error('Malformed speech clip: '+clip.path);

// The bytes of sound PATH: a WAV composed from speech clips for narration,
// otherwise the packed file. Null once CURRENT() turns false.
function speechVoiceFrames(path,profile){
 if(!speechResolved){speech().catch(()=>{});return 0;}
 return (speechVoice(speechResolved,path,profile)||[]).reduce((total,segment)=>total+segment.frames,0);
}
function speechVoice(index,path,profile){
 const selected=profile==='slow'||profile==='fast'?'assets/speech-profiles/'+profile+'/'+path.slice(7):path;
 return index.voices.get(selected)||index.voices.get(path);
}
async function soundBytes(path,current,profile="normal"){
 const index=await speech();

 if(!segments)return assetBytes(path);

  .forEach(([at,value,size])=>size===4?view.setUint32(at,value,true):view.setUint16(at,value,true));

 for(const segment of segments){
  if(segment.clip>=0){
   if(!decoded.has(segment.clip))decoded.set(segment.clip,await speechClip(index.clips[segment.clip]));
   if(!current())return null;
   const samples=decoded.get(segment.clip);
   for(let frame=0;frame<segment.frames;frame++){
    view.setInt16(at+frame*2,Math.max(-32768,Math.min(32767,Math.round(samples[segment.start+frame]*32768))),true);
   }
  }

}
function packedAudio(path,profile="normal"){

  if(url)return play();
  const request=++generation;audio.jungleLoading=true;
  try{
   const bytes=await soundBytes(path,()=>request===generation,profile);
   if(request!==generation)return;
   url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));audio.src=url;
   return await play();
  }finally{if(request===generation)audio.jungleLoading=false}
 };

  if(name==='src'){++generation;audio.jungleLoading=false;if(url)URL.revokeObjectURL(url);url=undefined}

}
function unavailableImage(path,error){imagePaths.delete(path);console.warn('Picture unavailable:',path,error)}
async function forgetResource(path){try{await (await caches.open('jungle-assets-v1')).delete(assetUrl(path))}catch{}}
async function fetchResource(path,read,priority='auto'){
 for(let attempt=0;attempt<3;attempt++){
  try{
   const url=assetUrl(path);
   const cacheable=/^(packs\/|assets\/)/.test(path);
   let cache;try{if(cacheable)cache=await caches.open('jungle-assets-v1')}catch{}
   const saved=cache&&await cache.match(url);
   if(saved)return await read(saved);
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
   let response;
   try{response=await fetch(url,{signal:controller.signal,priority});if(response.ok){
    // Consume under the timeout too: a stalled response body must be retryable.
    const bytes=await response.arrayBuffer();
    response=new Response(bytes,{status:response.status,headers:response.headers});
   }}finally{clearTimeout(timer)}
   if(response.ok&&cache)try{await cache.put(url,response.clone())}catch{}
   if(response.ok)return await read(response);
   if(![408,429,500,502,503,504].includes(response.status)||attempt===2)throw Error(path+' (HTTP '+response.status+')');
  }catch(error){
   if(attempt===2)throw error;

function writeAsset(file,bytes){
 Module.FS.mkdirTree(file.substring(0,file.lastIndexOf('/')));
 Module.FS.writeFile(file,bytes);
}
// A picture's file appears only once its full, verified bytes are here.
async function decodeImage(bytes){
 const url=URL.createObjectURL(new Blob([bytes]));
 try{const image=new Image();image.src=url;await image.decode()}finally{URL.revokeObjectURL(url)}
}
async function loadImage(path,priority){
 if(Module.FS.analyzePath('/'+path).exists)return;
 if(imageLoads.has(path))return imageLoads.get(path);

  await decodeImage(bytes);
  writeAsset('/'+path,bytes);
 });

 try{return await request}catch(error){imageLoads.delete(path);if(directAsset(path))await forgetResource(path);throw error}
}
// Few-KB previews (tools/web_images.py) stand in for book pictures while
// their full bytes download. Kryon caches Canvas textures and DOM object URLs
// by path, so a preview has its own, the one every host uses: assets/previews/
// and the logical path without "assets/" (tools/web_images.py preview_path).
// The full picture never shares it, and a preview never replaces it.
// Each book's previews share one small pack, checked like every asset pack.
let previewIndex;
const previewLoads=new Map(),previewSettled=new Set(),previewFile=path=>'/assets/previews/'+path.slice(7);
function previews(){
 previewIndex??=fetchResource('preview-images.json',response=>response.json())
  .then(manifest=>new JungleAssetPacks(manifest,path=>fetchResource(path,response=>response.arrayBuffer()),4*1024*1024,forgetResource))
  .catch(error=>{previewIndex=undefined;throw error});

}
function loadPreview(path){
 if(!path.startsWith('assets/')||previewLoads.has(path))return;

  if(!Object.hasOwn(packs.manifest.files,path))return false;
  const bytes=await packs.read(path);
  // A full picture that arrived first needs no stand-in.
  if(!Module.FS.analyzePath('/'+path).exists)writeAsset(previewFile(path),bytes);
  return true;

 // A preview is optional: without one the full picture still appears.
 request.catch(error=>console.warn('Preview unavailable:',path,error))
  .finally(()=>{previewSettled.add(path);pumpFull()});
}
// Full pictures download two at a time, most recently drawn first. A picture
// on screen always goes before a prefetched one, such as the next page, and
// prefetches use one slot at most, so a turned page never waits behind them.
// A drawn picture's few-KB preview arrives first: its full bytes start once
// the preview is here, or failed, or after fullPreviewWait. A queued picture
// nobody has asked for in a second, such as a page flipped past, leaves the
// queue; asking again brings it back. Hidden tabs still draw every 250 ms, so
// their pictures stay queued.
// A full picture that fails is asked for again after fullRetry, doubling,
// fullAttempts times in all; meanwhile its preview stays on screen.
const fullQueue=new Map(),fullLimit=2,fullStale=1000,fullPreviewWait=700,fullRetry=2000,fullAttempts=3,fullFailures=new Map();
let fullActive=0,fullPrefetching=0,fullTouch=0;
function fullFailed(path,error){
 const failure=fullFailures.get(path)||{count:0,until:0};
 failure.count++;failure.until=performance.now()+fullRetry*2**(failure.count-1);
 fullFailures.set(path,failure);
 if(failure.count>=fullAttempts)unavailableImage(path,error);else console.warn('Picture retrying:',path,error);
}
function fullWaiting(path){
 const failure=fullFailures.get(path);
 return Boolean(failure)&&performance.now()<failure.until;
}
function requestFull(path,prefetch=false){
 const now=performance.now(),old=fullQueue.get(path);
 fullQueue.set(path,{touch:++fullTouch,time:now,first:old?old.first:now,prefetch:prefetch&&(!old||old.prefetch)});
 pumpFull();
}
function fullReady(path,entry,now){
 return entry.prefetch||!previewLoads.has(path)||previewSettled.has(path)||now-entry.first>=fullPreviewWait;
}
function pumpFull(){
 const now=performance.now();
 for(const [path,entry] of fullQueue)if(now-entry.time>fullStale)fullQueue.delete(path);
 while(fullActive<fullLimit){
  let next,best;
  for(const [path,entry] of fullQueue){
   if(!fullReady(path,entry,now)||(entry.prefetch&&fullPrefetching>=fullLimit-1))continue;
   if(!best||(best.prefetch&&!entry.prefetch)||(best.prefetch===entry.prefetch&&entry.touch>best.touch)){next=path;best=entry}
  }
  if(!best)return;
  fullQueue.delete(next);fullActive++;
  const prefetch=best.prefetch;if(prefetch)fullPrefetching++;
  loadImage(next).then(()=>fullFailures.delete(next),error=>fullFailed(next,error)).finally(()=>{fullActive--;if(prefetch)fullPrefetching--;pumpFull()});
 }
}
const loadingCopy={
 en:{loading:'Gathering everything for you…',error:'We could not get everything yet. Check your connection and try again.',back:'Back',retry:'Try again'},
 de:{loading:'Wir holen alles für dich…',error:'Wir konnten noch nicht alles laden. Prüfe deine Verbindung und versuche es noch einmal.',back:'Zurück',retry:'Noch einmal'},
 es:{loading:'Estamos preparando todo para ti…',error:'Todavía no pudimos cargar todo. Revisa tu conexión e inténtalo de nuevo.',back:'Atrás',retry:'Reintentar'}
};
let activityIndex;
function activityManifest(){
 activityIndex??=fetchResource('activity-assets.json',r=>r.json()).catch(error=>{activityIndex=undefined;throw error});
 return activityIndex;
}
const overlay=document.getElementById('activity-loading');
// Background prefetches wait while any picture on screen is downloading.
const activityLoader=new JungleActivityLoader(async(path,background)=>{
 const priority=background?'low':'auto';
 if(/\.(webp|png|jpg)$/.test(path))return loadImage(path,priority);
 const bytes=await assetBytes(path,priority);writeAsset('/'+path,bytes);
 if(path.endsWith('.ogg')){
  const index=await speech(),clip=index.clips.find(clip=>clip.path===path);
  if(!clip)throw Error('Missing speech clip: '+path);
  await speechClip(clip);
 }
},state=>{
 const wasHidden=overlay.hidden;
 overlay.hidden=!state.shown||state.status==='ready'||state.status==='cancelled';
 for(const id of ['canvas-frame','kryon-dom-root','kryon-dom-paint']){const surface=document.getElementById(id);if(surface)surface.inert=!overlay.hidden}
 if(!wasHidden&&overlay.hidden)document.getElementById('canvas').focus();
 if(wasHidden&&!overlay.hidden)queueMicrotask(()=>document.getElementById('activity-back').focus());
 const copy=loadingCopy[siteLanguage];
 // The heading names only what is loading; without a name it stays empty.
 const heading=document.getElementById('activity-title');heading.textContent=state.title||'';heading.hidden=!state.title;
 // A packed cover, such as a book's from its shelf, shows from the bytes
 // already here, never from another download.
 const cover=document.getElementById('activity-cover'),logo='assets/jungle/branding/logo.webp';
 const path=state.cover||logo;if(cover.dataset.path!==path){
  cover.dataset.path=path;if(cover.dataset.url){URL.revokeObjectURL(cover.dataset.url);delete cover.dataset.url}
  if(!directAsset(path)&&Module.FS?.analyzePath('/'+path).exists)cover.src=cover.dataset.url=URL.createObjectURL(new Blob([Module.FS.readFile('/'+path)]));
  else cover.src=assetUrl(directAsset(path)?path:logo);
 }
 document.getElementById('activity-message').textContent=state.status==='error'?copy.error:copy.loading;
 const progress=document.getElementById('activity-progress');progress.max=Math.max(1,state.total);progress.value=state.loaded;
 progress.setAttribute('aria-label',copy.loading);
 document.getElementById('activity-count').textContent=state.total?state.loaded+' / '+state.total:'';
 document.getElementById('activity-back').textContent=copy.back;
 const retry=document.getElementById('activity-retry');retry.textContent=copy.retry;retry.hidden=state.status!=='error';
 if(state.status==='error')console.error('Activity preload failed:',state.error);
},()=>fullActive===0);
document.getElementById('activity-back').onclick=()=>activityLoader.back();
document.getElementById('activity-retry').onclick=()=>activityLoader.retry();
overlay.addEventListener('keydown',event=>{event.stopPropagation();if(event.key==='Escape')activityLoader.back()});
// START is the title's book-start request: which Picture Book shelf opens.
// Its books themselves download one at a time (bookReady).
function activityReady(index,language,profile,title,start=''){
 const status=activityLoader.request('game:'+index+':'+language+':'+profile+':'+start,async()=>{
  const manifest=await activityManifest(),activity=manifest.activities[index];
  if(!activity)throw Error('Unknown activity: '+index);
  await speech();
  const shelf=activity.shelves?Object.hasOwn(activity.shelves,start)?activity.shelves[start]:activity.shelves['']:[];
  return {title,cover:activity.cover,files:[...activity.files,...shelf,...activity.speech[language][profile]]};
 },title);
 return status==='ready'?bookReady(index,language,profile):status;
}
// Picture Book reports the open book, the next one, the orientation and the
// book's title (jungle.book-open; games/book/jungle_book.zi BookDownload).
// Only that book downloads, behind the loading screen: the current
// orientation's pictures and the current language's narration. While it is
// read, the next book downloads in the background (prefetch), which pauses
// when the reader leaves the book. Back returns to the shelf.
let openBook;
function bookRequest(book,id){
 return ['book:'+book.index+':'+id+':'+book.orientation+':'+book.language+':'+book.profile,async()=>{
  const found=(await activityManifest()).activities[book.index]?.books?.find(entry=>entry.id===id);
  if(!found)throw Error('Unknown book: '+id);
  const speech=found.speech[book.language];
  return {title:book.title,cover:found.cover,files:[...found.files[book.orientation],...(speech[book.profile]||speech.normal)]};
 },book.title];
}
function bookReady(index,language,profile){
 const book=openBook;
 if(book?.index!==index||book.opened||book.back)return 'ready';
 book.language=language;book.profile=profile;
 const status=activityLoader.request(...bookRequest(book,book.id));
 if(status==='cancelled'){book.back=true;activityLoader.cancel();return 'ready'}
 if(status==='ready'){book.opened=true;prefetchNextBook()}
 return status;
}
function prefetchNextBook(){
 const book=openBook;
 if(book?.opened&&book.next)activityLoader.prefetch(...bookRequest(book,book.next));else activityLoader.pausePrefetch();
}
// Whether the reader left the book's download with Back.
function bookOpen(index,request){
 const [id='',next='',orientation='',title='']=request.split('|');
 if(!id){if(openBook){openBook=undefined;activityLoader.pausePrefetch()}return false}
 const side=orientation==='portrait'?'portrait':'landscape';
 if(openBook?.index===index&&openBook.id===id){
  if(openBook.back){openBook=undefined;activityLoader.pausePrefetch();return true}
  if(openBook.next!==next||openBook.orientation!==side){openBook.next=next;openBook.orientation=side;prefetchNextBook()}
  return false;
 }
 activityLoader.pausePrefetch();
 openBook={index,id,next,orientation:side,title,opened:false,back:false};
 return false;
}
let sceneIndex;
function sceneManifest(){
 sceneIndex??=fetchResource('scene-assets.json',r=>r.json()).catch(error=>{sceneIndex=undefined;throw error});
 return sceneIndex;
}
// A title scene's own pictures load quietly; a slow download names the
// scene's place (TITLE, host/jungle_title.zi TitleScenePlace).
function sceneReady(path,title){
 return activityLoader.request('scene:'+path,async()=>{
  const manifest=await sceneManifest(),files=manifest[path];
  if(!files)throw Error('Unknown scene: '+path);
  return {title,cover:path,files};
 },title,true);
}
var Module={canvas:document.getElementById('canvas'),locateFile:assetUrl,print:console.log,printErr:console.error,
 jungleLanguage:updateSiteLanguage,
 jungleActivityReady(...args){const status=activityReady(...args);return status==='ready'?1:status==='cancelled'?-1:0},
 jungleSceneReady(...args){const status=sceneReady(...args);return status==='ready'?1:status==='cancelled'?-1:0},
 jungleBookOpen:bookOpen,
 junglePreloadReset(){activityLoader.cancel();openBook=undefined;activityLoader.pausePrefetch()},
 jungleActivityStarted(index){window.dispatchEvent(new CustomEvent('jungle-activity-started',{detail:{index}}))},
 jungleAudio:packedAudio,
 jungleVoiceFrames:speechVoiceFrames,
 // Whether PATH's full picture is here; otherwise its preview and full bytes
 // are requested, a PREFETCH behind every picture on screen.
 jungleImageReady(path,prefetch=false){
  if(Module.FS.analyzePath('/'+path).exists)return true;
  // A book opening behind the loading screen brings its own pictures.
  if(openBook&&!openBook.opened)return false;
  if(imagePaths.has(path)&&!imageLoads.has(path)){loadPreview(path);if(!fullWaiting(path))requestFull(path,prefetch)}
  return false;
 },
 // Whether PATH's preview is here, at its own path (previewFile).
 junglePreviewReady(path){
  return path.startsWith('assets/')&&Module.FS.analyzePath(previewFile(path)).exists;
 },
 preRun:[function(){
  Module.addRunDependency('menu-pictures');
  fetchResource('images.json',response=>response.json()).then(async paths=>{
   imagePaths=new Set(paths);
   // Open once the menu's own pictures are here, with bounded parallel
   // downloads. Activities wait for their complete generated preload list;
   // title scenes fetch only their own pictures through the short loader.
   // A blocked optional picture must not prevent the game from starting.
   // Story letters use the shared bitmap atlases. Load these tiny fonts
   // before typing can draw them; they do not request lazy images themselves.
   // The title scenes open on their few-KB pictures; the clean ones follow.
   const menu=paths.filter(path=>/^assets\/jungle\/([^/]+|title\/[^/]+-low\.(?:jpg|webp)|branding\/[^/]+)$/.test(path)||path.endsWith('/font.png'));
   let next=0;
   await Promise.all(Array.from({length:8},async()=>{while(next<menu.length){const path=menu[next++];try{await loadImage(path)}catch(error){unavailableImage(path,error)}}}));
   Module.removeRunDependency('menu-pictures');
  }).catch(e=>{console.error(e);Module.onAbort()});
 }],
 onRuntimeInitialized(){
  window.jungleStartupMs=performance.now();document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';document.getElementById('canvas').focus();
  // The pack and preview indexes download once the menu shows, not with
  // the runtime; a game asking first simply starts them sooner.
  packIndex().catch(error=>console.warn('Asset index unavailable:',error));
  previews().catch(error=>console.warn('Preview index unavailable:',error));
 },
 onAbort(){document.getElementById('loading').style.display='grid';document.getElementById('status').textContent=siteCopy[siteLanguage].error}
};

const mobileInput=document.getElementById('mobile-input');
const keyToCanvas=(key,code=key)=>{for(const type of ['keydown','keyup'])Module.canvas.dispatchEvent(new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true}))};
const flushMobileText=()=>{if(mobileInput.composing)return;for(const key of mobileInput.value){if(key===' ')keyToCanvas(' ','Space');else Module.canvas.dispatchEvent(new KeyboardEvent('keypress',{key,bubbles:true,cancelable:true}))};mobileInput.value=''};
mobileInput.addEventListener('input',flushMobileText);
mobileInput.addEventListener('compositionstart',()=>mobileInput.composing=true);
mobileInput.addEventListener('compositionend',()=>{mobileInput.composing=false;flushMobileText()});
mobileInput.addEventListener('beforeinput',event=>{if(event.inputType==='deleteContentBackward'){event.preventDefault();keyToCanvas('Backspace')}if(event.inputType==='insertLineBreak'){event.preventDefault();keyToCanvas('Enter')}});
document.getElementById('canvas-frame').addEventListener('pointerup',()=>{if(Module.jungleKeyboardWanted&&matchMedia('(pointer:coarse)').matches)mobileInput.focus({preventScroll:true})});
const resizeApp=()=>document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||innerHeight)+'px');
window.visualViewport?.addEventListener('resize',resizeApp);addEventListener('resize',resizeApp);resizeApp();
window.jungleMetrics={frames:[],mutations:0,longTasks:[]};
if(new URLSearchParams(location.search).has('metrics')){
 const panel=document.getElementById('performance-panel');
 panel.hidden=false;
 if(backend==='dom')new MutationObserver(changes=>window.jungleMetrics.mutations+=changes.filter(change=>!change.target.closest?.('#performance-panel')).length).observe(document.body,{subtree:true,childList:true,attributes:true});
 new PerformanceObserver(entries=>window.jungleMetrics.longTasks.push(...entries.getEntries().map(entry=>entry.duration))).observe({entryTypes:['longtask']});
 requestAnimationFrame(function measure(time){window.jungleMetrics.frames.push(time);if(window.jungleMetrics.frames.length>241)window.jungleMetrics.frames.shift();requestAnimationFrame(measure)});
 const other=backend==='dom'?'canvas':'dom';
 setInterval(()=>{
  const frames=window.jungleMetrics.frames;
  let frameTime=0;
  if(frames.length>1){
   const gaps=frames.slice(1).map((time,index)=>time-frames[index]).sort((first,second)=>first-second);
   frameTime=gaps[Math.floor((gaps.length-1)*0.95)];
  }
  const memory=performance.memory;
  panel.textContent=backend.toUpperCase()+' · rAF p95 '+frameTime.toFixed(1)+' ms\n'
   +(memory?'JS heap '+(memory.usedJSHeapSize/1048576).toFixed(1)+' / '+(memory.jsHeapSizeLimit/1048576).toFixed(0)+' MiB\n':'JS heap unavailable in this browser\n')
   +'DOM '+document.getElementsByTagName('*').length+' nodes · Kryon '+document.querySelectorAll('[data-kryon-id]').length+' · mutations '+window.jungleMetrics.mutations+'\n'
   +'rAF is callback cadence, not render FPS\nCPU / RAM: performance.html';
  const link=document.createElement('a');
  link.href=(other==='dom'?'dom.html':'canvas.html')+'?metrics=1';
  link.textContent='Open '+other+' edition';
  panel.append(document.createElement('br'),link);
 },500);
}

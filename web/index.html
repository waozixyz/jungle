<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e3ece4;font-family:system-ui,sans-serif;color:#3e332a}body{display:flex;align-items:center;justify-content:center}#canvas-frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}body{height:var(--app-height,100dvh)}#canvas-frame{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#mobile-input{position:fixed;bottom:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:.01;font-size:16px}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:#e3ece4;pointer-events:none}#brand-logo{display:block;width:min(80vw,440px);height:auto;margin:0 auto 1rem}#loading strong{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:500}#loading p{font-size:1rem}#print-sheet{display:none}@media print{body{display:block;background:white}#canvas-frame,body{height:var(--app-height,100dvh)}#canvas-frame{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#mobile-input{position:fixed;bottom:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:.01;font-size:16px}#loading{display:none!important}#print-sheet{display:block;padding:1cm;color:black}#print-picture{width:100%;image-rendering:auto}#print-story{white-space:pre-wrap;font:16px/1.5 system-ui,sans-serif}}

<body>
<div id="canvas-frame"><canvas id="canvas" tabindex="0" aria-label="Jungle Academy learning games"></canvas></div>
<div id="loading" role="status"><img id="brand-logo" src="/assets/jungle/branding/logo.png" alt="Jungle Academy"><p id="status">Opening your books…</p></div>
<textarea id="mobile-input" disabled aria-label="Story text" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
<section id="print-sheet"><img id="print-picture" alt="Your dinosaur picture"><pre id="print-story"></pre></section>
<script>
const buildRevision='__JUNGLE_BUILD_REVISION__';
function assetUrl(path){
 const url=new URL(path,location.href);url.searchParams.set('v',buildRevision);return url.href;
}
const siteCopy={
 en:{title:'Jungle Academy — Gentle learning for little ones',description:'Learn letters and numbers, explore watercolor picture books, count up to ten, and draw and color. Play in English, German and Spanish.',opening:'Opening your books…',error:'The game could not open. Please reload to try again.',locale:'en_GB',alt:'A young tiger with an open storybook, the Jungle Academy icon',canvas:'Jungle Academy learning games',story:'Story text'},
 de:{title:'Jungle Academy — Sanftes Lernen für die Kleinen',description:'Buchstaben und Zahlen lernen, Aquarell-Bilderbücher entdecken, bis zehn zählen, zeichnen und ausmalen. Auf Englisch, Deutsch und Spanisch.',opening:'Deine Bücher werden geöffnet…',error:'Das Spiel konnte nicht geöffnet werden. Bitte lade die Seite neu.',locale:'de_DE',alt:'Ein junger Tiger mit einem offenen Bilderbuch, das Symbol von Jungle Academy',canvas:'Jungle Academy Lernspiele',story:'Text der Geschichte'},
 es:{title:'Jungle Academy — Aprendizaje tranquilo para los pequeños',description:'Aprende letras y números, explora libros ilustrados en acuarela, cuenta hasta diez, dibuja y colorea. Juega en inglés, alemán y español.',opening:'Abriendo tus libros…',error:'No se pudo abrir el juego. Recarga la página para intentarlo de nuevo.',locale:'es_ES',alt:'Un pequeño tigre con un libro abierto, el icono de Jungle Academy',canvas:'Juegos educativos de Jungle Academy',story:'Texto de la historia'}
};
let siteLanguage='en';
function updateSiteLanguage(language){
 siteLanguage=Object.hasOwn(siteCopy,language)?language:'en';const copy=siteCopy[siteLanguage];
 document.documentElement.lang=siteLanguage;document.title=copy.title;
 for(const selector of ['meta[name="description"]','meta[property="og:description"]','meta[name="twitter:description"]'])document.querySelector(selector).content=copy.description;
 for(const selector of ['meta[property="og:title"]','meta[name="twitter:title"]'])document.querySelector(selector).content=copy.title;
 for(const selector of ['meta[property="og:image:alt"]','meta[name="twitter:image:alt"]'])document.querySelector(selector).content=copy.alt;
 document.querySelector('meta[property="og:locale"]').content=copy.locale;
 document.querySelectorAll('meta[property="og:locale:alternate"]').forEach((meta,index)=>meta.content=Object.values(siteCopy).filter(value=>value.locale!==copy.locale)[index].locale);
 document.getElementById('status').textContent=copy.opening;
 document.getElementById('canvas').setAttribute('aria-label',copy.canvas);
 document.getElementById('mobile-input').setAttribute('aria-label',copy.story);
}
// Animation frames stop in hidden tabs. Keep the learning sequence ticking
// with a timer while hidden, and resume normal browser frames when visible.
const browserFrame=window.requestAnimationFrame.bind(window);
const cancelBrowserFrame=window.cancelAnimationFrame.bind(window);
const pendingFrames=new Map();let nextFrameId=1;
function scheduleHiddenFrames(){
 if(!document.hidden)return;
 for(const entry of pendingFrames.values())if(!entry.timer)entry.timer=setTimeout(()=>entry.run(performance.now()),250);
}
window.requestAnimationFrame=callback=>{
 const id=nextFrameId++;const entry={frame:0,timer:0,run(time){
  if(!pendingFrames.has(id))return;
  pendingFrames.delete(id);cancelBrowserFrame(entry.frame);clearTimeout(entry.timer);callback(time);
 }};
 pendingFrames.set(id,entry);entry.frame=browserFrame(entry.run);scheduleHiddenFrames();return id;
};
window.cancelAnimationFrame=id=>{const entry=pendingFrames.get(id);if(entry){pendingFrames.delete(id);cancelBrowserFrame(entry.frame);clearTimeout(entry.timer)}};
document.addEventListener('visibilitychange',scheduleHiddenFrames);
const imageLoads=new Map();
let imagePaths=new Set();
async function loadImage(path){
 if(Module.FS.analyzePath('/'+path).exists)return;
 if(imageLoads.has(path))return imageLoads.get(path);
 const request=fetch(assetUrl(path)).then(async response=>{
  if(!response.ok)throw Error(path);
  const bytes=new Uint8Array(await response.arrayBuffer());
  Module.FS.mkdirTree('/'+path.substring(0,path.lastIndexOf('/')));
  Module.FS.writeFile('/'+path,bytes);
 });
 imageLoads.set(path,request);return request;
}
var Module={canvas:document.getElementById('canvas'),locateFile:assetUrl,print:console.log,printErr:console.error,
 jungleLanguage:updateSiteLanguage,
 jungleImageReady(path){
  if(Module.FS.analyzePath('/'+path).exists)return true;
  if(imagePaths.has(path)&&!imageLoads.has(path))void loadImage(path).catch(console.error);
  return false;
 },
 preRun:[function(){
  Module.addRunDependency('menu-pictures');
  fetch(assetUrl('images.json')).then(r=>{if(!r.ok)throw Error('picture list');return r.json()}).then(async paths=>{
   imagePaths=new Set(paths);
   // Show the opening screen until every picture is available, with bounded
   // parallel downloads so a large library does not flood the connection.
   let next=0;
   await Promise.all(Array.from({length:8},async()=>{while(next<paths.length){const path=paths[next++];await loadImage(path)}}));
   Module.removeRunDependency('menu-pictures');
  }).catch(e=>{console.error(e);Module.onAbort()});
 }],
 onRuntimeInitialized(){document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';document.getElementById('canvas').focus()},
 onAbort(){document.getElementById('loading').style.display='grid';document.getElementById('status').textContent=siteCopy[siteLanguage].error}
};

const mobileInput=document.getElementById('mobile-input');
const keyToCanvas=(key,code=key)=>{for(const type of ['keydown','keyup'])Module.canvas.dispatchEvent(new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true}))};
const flushMobileText=()=>{if(mobileInput.composing)return;for(const key of mobileInput.value){if(key===' ')keyToCanvas(' ','Space');else Module.canvas.dispatchEvent(new KeyboardEvent('keypress',{key,bubbles:true,cancelable:true}))};mobileInput.value=''};
mobileInput.addEventListener('input',flushMobileText);
mobileInput.addEventListener('compositionstart',()=>mobileInput.composing=true);
mobileInput.addEventListener('compositionend',()=>{mobileInput.composing=false;flushMobileText()});
mobileInput.addEventListener('beforeinput',event=>{if(event.inputType==='deleteContentBackward'){event.preventDefault();keyToCanvas('Backspace')}if(event.inputType==='insertLineBreak'){event.preventDefault();keyToCanvas('Enter')}});
Module.canvas.addEventListener('pointerup',()=>{if(Module.jungleKeyboardWanted&&matchMedia('(pointer:coarse)').matches)mobileInput.focus({preventScroll:true})});
const resizeApp=()=>document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||innerHeight)+'px');
window.visualViewport?.addEventListener('resize',resizeApp);addEventListener('resize',resizeApp);resizeApp();
</script>
<script src="jungle.js" defer></script>
